[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uad-handles"
version = "0.1.0"
description = "Handle-aware UAD toy benchmarks for the access-model UAD paper"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "../LICENSE.md"}
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
