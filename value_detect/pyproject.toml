[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "value-detect"
version = "0.1.0"
description = "Unsupervised value discovery (directional UAD), extending Gunnar Zarncke's Unsupervised Agent Discovery"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
