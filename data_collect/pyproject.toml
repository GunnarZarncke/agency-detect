[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-collect"
version = "0.1.0"
description = "Real-machine trace collection for intention-detection experiments"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "../LICENSE.md"}
dependencies = [
    "numpy>=1.20.0",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
