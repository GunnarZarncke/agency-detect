[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-detect-workspace"
version = "0.1.0"
description = "Monorepo workspace for unsupervised agent discovery research packages"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE.md"}
authors = [
    {name = "Agency Detection Research Team"}
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.900",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "agency_detect/tests",
    "learn_agents/tests",
    "agent_spotlight/tests",
    "amortized_agency/tests",
    "intention_detect/tests",
    "uad_worm/tests",
]
pythonpath = [
    ".",
    "agency_detect/src",
    "learn_agents/src",
    "agent_spotlight/src",
    "hierarchical_spotlight/src",
    "amortized_agency/src",
    "intention_detect/src",
    "data_collect/src",
    "uad_handles/src",
    "uad_worm/src",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
