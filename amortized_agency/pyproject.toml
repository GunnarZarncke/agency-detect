[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amortized-agency"
version = "0.1.0"
description = "Amortized same-agent affinity models and benchmarks"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "../LICENSE.md"}
dependencies = [
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
