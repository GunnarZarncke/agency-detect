[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-spotlight"
version = "0.1.0"
description = "Hierarchical chunk-fusion spotlight discovery"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "../LICENSE.md"}
dependencies = [
    "numpy>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]
